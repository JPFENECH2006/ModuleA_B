<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe browser</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><header><h1>Malta Food & Recipe Hub</h1><p>Scenario C1: Browse recipes, pages and details</p></header>
<main><div class="row between"><h2>Recipes</h2><span id="count" class="muted"></span></div><p id="status" class="status" role="status"></p><div id="cards" class="cards"></div>
<div class="row between" style="margin:22px 0"><button id="previous">Previous</button><span id="pageText"></span><button id="next">Next</button></div>
<section class="panel" id="detail" hidden><h2>Recipe details</h2><div id="detailContent"></div><button id="close">Close</button></section></main></body></html>
