<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe favourites</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><header><h1>Recipe Favourites</h1><p>Scenario C2: Login, Bearer token, add/remove favourites</p></header><main>
<section class="panel" id="loginPanel"><h2>Sign in</h2><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" value="demo@example.com" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" value="demo1234" required></div><button>Login</button></form><p class="status" id="loginStatus" role="status"></p></section>
<section id="appPanel" hidden><div class="row between"><h2>My favourites</h2><button id="logout">Log out</button></div><p id="appStatus" class="status" role="status"></p><div class="controls"><div><label for="recipeId">Recipe to add (ID)</label><input id="recipeId" type="number" min="1" value="4"></div><button id="add">Add favourite</button></div><div id="cards" class="cards"></div><p id="empty" class="muted"></p></section></main></body></html>
