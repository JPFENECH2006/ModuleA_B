<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe search dashboard</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body>
<header><h1>Recipe Explorer</h1><p>Scenario C3: Combined frontend search, cuisine filter and sorting</p></header><main><h2>Explore recipes</h2><form id="filters" class="controls"><div><label for="search">Search title</label><input id="search" placeholder="Try pasta"></div><div><label for="cuisine">Cuisine</label><select id="cuisine"><option value="">All cuisines</option></select></div><div><label for="sort">Sort</label><select id="sort"><option value="id">ID ascending</option><option value="time">Shortest time</option><option value="title">Title A-Z</option></select></div><button type="submit">Apply</button><button type="button" id="reset">Clear</button></form><p id="summary" class="muted"></p><p id="status" class="status" role="status"></p><div id="cards" class="cards"></div></main></body></html>
